services:
  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production

      # AWS
      AWS_REGION: ${S3_REGION:-eu-north-1}
      LIFEE_AWS_REGIONS: ${LIFEE_AWS_REGIONS:-eu-north-1}
      LIFEE_EXPORT_QUEUE_URL: ${LIFEE_EXPORT_QUEUE_URL}

      # Credentials (prod: idéalement via IAM role; local: via env)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}

      # DB
      DATABASE_URL: ${DATABASE_URL}

      # S3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # Worker tuning
      WORKER_CONCURRENCY: "1"
      EXPORT_VISIBILITY_HEARTBEAT_SEC: "30"

    restart: unless-stopped
